[package]
name = "valuables-vault"
version = "0.9.0"
description = "Valuables Vault — secure offline inventory for valuables, safes and bank lockers"
authors = ["Ing.-Büro Sachit Shrestha <support@medtec24.com>"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/sachitss/vault"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "valuables_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
