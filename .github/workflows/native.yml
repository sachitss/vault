name: Native apps

# Builds the native installers from the same web code as the browser version:
#   Windows  .msi + setup .exe   macOS  universal .dmg   Linux  .deb .rpm .AppImage
#   Android  .apk + .aab         iOS    .ipa (only when Apple signing secrets are set)
#
# Runs when a release is published (the files are attached to it) and on demand
# (Actions > Native apps > Run workflow; the files are kept as workflow artifacts,
# or attached to an existing release if you give its tag).
#
# Optional repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#       Release signing key for Android. Without it the APK is signed with a throwaway key
#       made for this run: it installs, but a later build cannot update it in place.
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
#       Signing + notarisation for macOS, and needed at all for iOS.
#   WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#       Authenticode signing for Windows (avoids the SmartScreen warning).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the files to this existing release tag (e.g. v0.9.0). Leave empty to keep them as workflow artifacts only.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: native-${{ github.ref }}-${{ inputs.release_tag || github.event.release.tag_name || 'run' }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles msi,nsis
            files: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS (Apple silicon + Intel)
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg,app
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            files: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Build the app (web layer)
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          python tools/build.py

      - name: Windows code signing (optional)
        if: runner.os == 'Windows' && env.HAS_WIN_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $sec = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
          Remove-Item $pfx
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $conf.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256' -Force
          $conf.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue 'http://timestamp.digicert.com' -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - name: Build installers
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Without a certificate, macOS builds are ad-hoc signed ("-") so they run on Apple silicon.
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            export APPLE_SIGNING_IDENTITY=-
            unset APPLE_CERTIFICATE APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build ${{ matrix.args }}

      - name: Linux smoke test (app starts and shows the setup screen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb dbus-x11 imagemagick
          export HOME=$RUNNER_TEMP/home && mkdir -p $HOME
          Xvfb :99 -screen 0 1280x900x24 & sleep 2
          export DISPLAY=:99 WEBKIT_DISABLE_DMABUF_RENDERER=1
          dbus-run-session -- src-tauri/target/release/valuables-vault & PID=$!
          sleep 15
          kill -0 $PID || { echo "::error::Native app exited during start-up"; exit 1; }
          import -window root smoke.png
          test -d "$HOME/.local/share/com.medtec24.valuablesvault" || { echo "::error::App data directory was not created"; exit 1; }
          kill $PID

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            for f in $pattern; do [ -f "$f" ] && cp "$f" out/; done
          done <<'EOF'
          ${{ matrix.files }}
          EOF
          ls -la out
          [ "$(ls out | wc -l)" -gt 0 ] || { echo "::error::No installers produced"; exit 1; }
          cd out && for f in *; do n=$(echo "$f" | tr ' ' '-'); [ "$f" = "$n" ] || mv "$f" "$n"; done

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: |
            out/*
            smoke.png
          if-no-files-found: error

      - name: Attach to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: out/*

  android:
    name: Android (phones + tablets)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: Android NDK and build tools
        run: |
          sdkmanager --install "ndk;$NDK_VERSION" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV

      - name: Build the app (web layer)
        run: |
          npm ci --no-audit --no-fund
          python tools/build.py

      - name: Generate the Android project
        run: |
          npx tauri android init --ci
          # app icons made by "tauri icon" (src-tauri/icons/android)
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      - name: Build APK and App Bundle
        run: npx tauri android build --apk --aab --ci

      - name: Sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT=$ANDROID_HOME/build-tools/34.0.0
          KS=$RUNNER_TEMP/release.jks
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > $KS
            echo "SIGNING=release key" >> $GITHUB_ENV
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key. The APK installs, but future builds cannot update it in place (uninstall first, after a backup)."
            KS_PASS=$(openssl rand -hex 16); KEY_PASS=$KS_PASS; KEY_ALIAS=vault
            keytool -genkeypair -keystore $KS -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias $KEY_ALIAS \
              -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Valuables Vault (unofficial build), O=Ing.-Buero Sachit Shrestha" > /dev/null
            echo "SIGNING=throwaway key" >> $GITHUB_ENV
          fi
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          APK=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$APK" aligned.apk
          $BT/apksigner sign --ks $KS --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" \
            --out "out/Valuables-Vault_${V}_android-universal.apk" aligned.apk
          $BT/apksigner verify --print-certs "out/Valuables-Vault_${V}_android-universal.apk" | head -3
          AAB=$(ls src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab | head -1)
          cp "$AAB" "out/Valuables-Vault_${V}_android.aab"
          jarsigner -keystore $KS -storepass "$KS_PASS" -keypass "$KEY_PASS" -sigalg SHA256withRSA -digestalg SHA-256 \
            "out/Valuables-Vault_${V}_android.aab" "$KEY_ALIAS" > /dev/null
          rm -f $KS aligned.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: native-Android
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: out/*

  ios:
    name: iOS + iPadOS
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Apple signing available?
        if: env.HAS_APPLE != 'true'
        run: |
          echo "::notice::iOS skipped: Apple only installs signed apps. Add the APPLE_* secrets (Apple Developer Program membership) to build the .ipa. Until then, iPhone and iPad use the installable web app."
      - uses: actions/checkout@v4
        if: env.HAS_APPLE == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_APPLE == 'true'
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        if: env.HAS_APPLE == 'true'
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_APPLE == 'true'
        with:
          targets: aarch64-apple-ios
      - name: Build
        if: env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          npm ci --no-audit --no-fund
          python tools/build.py
          npx tauri ios init --ci
          npx tauri ios build --export-method app-store-connect --ci
          mkdir -p out && find src-tauri/gen/apple/build -name '*.ipa' -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        if: env.HAS_APPLE == 'true'
        with:
          name: native-iOS
          path: out/*
