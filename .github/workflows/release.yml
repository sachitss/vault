name: Release

# Publishes the installers to a GitHub Release. Either push a tag like v0.9.0
# (matching "version" in package.json) or create the release on GitHub
# (Releases > Draft a new release > tag v0.9.0 > Publish); the workflow then
# builds, tests and attaches all downloads.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Tag matches package.json version
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1; }

      - run: python tools/build.py
      - run: python tests/run_all.py
      - run: python tools/package.py

      - name: Release notes from CHANGELOG.md
        run: |
          V=${GITHUB_REF_NAME#v}
          awk -v v="$V" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md > notes.md
          cat >> notes.md <<'MD'

          ### Downloads
          | Platform | File | How to install |
          |---|---|---|
          | Windows 10/11 | `Valuables-Vault_*_x64-setup.exe` (or `.msi`) | Double-click; SmartScreen: More info > Run anyway |
          | macOS 10.15+ | `Valuables-Vault_*_universal.dmg` | Drag to Applications; first start: right-click > Open |
          | Linux | `.deb`, `.rpm` or `.AppImage` | `sudo apt install ./Valuables-Vault_*_amd64.deb` |
          | Android 8+ (phones, tablets) | `Valuables-Vault_*_android-universal.apk` | Open on the device, allow *Install unknown apps* |
          | iPhone, iPad (native) | `Valuables-Vault_*_ios-unsigned.ipa` | Sign with your Apple ID using Sideloadly or AltStore (see INSTALL.md) |
          | iPhone, iPad, any browser | — | https://sachitss.github.io/vault/ > *Add to Home Screen* / *Install app* |
          | Alternative (desktop) | `ValuablesVault-*-Windows.zip` / `-macOS.zip` / `-Linux.tar.gz` | Script installers: `install.bat` / `install.command` / `install.sh` |
          | No installation | `ValuablesVault-*-Standalone.html` | Open in Chrome, Edge, Firefox or Safari |

          The native installers are added by the *Native apps* workflow about 30 minutes after publishing.
          Full guide: [docs/INSTALL.md](https://github.com/sachitss/vault/blob/main/docs/INSTALL.md).
          Verify downloads with `SHA256SUMS.txt`. Powered by © Ing.-Büro Sachit Shrestha · support@medtec24.com
          MD

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Valuables Vault ${{ github.ref_name }}
          body_path: notes.md
          files: dist/release/*
          fail_on_unmatched_files: true
